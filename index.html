<html lang="zh-CN">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #faf8f3;
      --accent: #e8603c;
      --muted: #8a8a9a;
      --card-bg: #ffffff;
      --tag-bg: #f0ede6;
      --shadow: 0 4px 24px rgba(26,26,46,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      padding: 36px 22px 20px;
      max-width: 520px;
      margin: auto;
    }
    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 16px;
    }
    .date-badge .dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
    }
    .progress-wrap {
      max-width: 520px;
      margin: 0 auto 28px;
      padding: 0 22px;
    }
    .progress-bar {
      height: 3px;
      background: #e2ded6;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .progress-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }
    .cards-container {
      max-width: 520px;
      margin: auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 28px 26px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp 0.45s ease forwards;
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.26s; }
    .card:nth-child(5) { animation-delay: 0.33s; }
    .card:nth-child(6) { animation-delay: 0.38s; }
    .card:nth-child(7) { animation-delay: 0.43s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .word {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .card-num {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: var(--tag-bg);
      padding: 4px 10px;
      border-radius: 100px;
      margin-top: 6px;
    }
    .meaning-tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 18px;
    }
    .phonetic {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      font-style: italic;
    }
    .divider {
      height: 1px;
      background: #f0ede6;
      margin-bottom: 18px;
    }
    .sentence-en {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 8px;
    }
    .highlight { color: var(--accent); font-style: italic; font-weight: 600; }
    .sentence-zh {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 14px;
      min-height: 46px;
      transition: all 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-word { background: var(--ink); color: #fff; flex: 1; }
    .btn-sent { background: var(--tag-bg); color: var(--ink); flex: 1.2; }
    .btn:active { transform: scale(0.96); }
    .btn.playing { background: var(--accent); color: #fff; }
    .btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .review-label {
      max-width: 520px;
      margin: 4px auto 12px;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

      max-width: calc(100% - 32px);
      margin: 24px 16px 0;
      padding: 24px 22px;
      background: var(--ink);
      color: rgba(255,255,255,0.85);
      border-radius: 28px;
      font-size: 14px;
      line-height: 1.9;
    }

    .footer .tip {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
    }
    .streak-row {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto 20px;
      padding: 0 22px;
    }
    .streak-box {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 14px 18px;
      flex: 1;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .streak-icon { font-size: 22px; }
    .streak-info .val { font-size: 20px; font-weight: 700; line-height: 1; }
    .streak-info .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tts-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(232,96,60,0.12);
      border-radius: 40px;
      padding: 3px 12px;
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 0.3px;
    }
    @media (max-width: 400px) {
      h1 { font-size: 34px; }
      .word { font-size: 36px; }
      .sentence-en { font-size: 18px; }
    }
  </style>
</head>

// 为了严谨，动态获取其长度 (word总数240+，实际原库达300，功能完好)
// --------------------------------------------------------------

// --------------------- 全局播放控制 -----------------------------
let currentBtn = null;
let currentAudio = null;
let currentObjectUrl = null;
let currentFetchAbort = null;      // 用于取消正在进行的fetch
let isWorkerPlaying = false;        // 标记Worker播放中

// 停止所有发音并清理状态
function stopCurrent() {
  // 取消正在进行的 fetch 请求
  if (currentFetchAbort) {
    currentFetchAbort.abort();
    currentFetchAbort = null;
  }
  // 停止正在播放的音频
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = null;
  }
  if (currentBtn) {
    currentBtn.classList.remove('playing');
    currentBtn = null;
  }
  try { speechSynthesis.cancel(); } catch(e) {}
  isWorkerPlaying = false;
}

// ---------- 降级方案: 原有的有道词典 + 逐词合成 (稳定可靠) ----------
function legacySpeak(text, btn, isWord) {
  stopCurrent(); // 确保完全停止旧播放
  if (btn) { btn.classList.add('playing'); currentBtn = btn; }

  const onDone = () => {
    if (btn) btn.classList.remove('playing');
    if (currentBtn === btn) currentBtn = null;
  };

  // 单词使用有道单词语音
  if (isWord) {
    const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
    const audio = new Audio();
    currentAudio = audio;
    audio.onended = onDone;
    audio.onerror = onDone;
    audio.src = url;
    audio.play().catch(onDone);
  } 
  // 句子：逐词使用有道接口（确保句子完整发音）
  else {
    const words = text.replace(/[.?!,;:]+/g, '').trim().split(/\s+/).filter(Boolean);
    if (words.length === 0) { onDone(); return; }
    const voiceMap = { 'to':'too', 'the':'thee', 'a':'ay' };
    let idx = 0;
    function playNext() {
      if (idx >= words.length) { onDone(); return; }
      const w = words[idx++];
      const audioWord = voiceMap[w.toLowerCase()] || w;
      const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(audioWord) + '&type=2';
      const audio = new Audio();
      currentAudio = audio;
      audio.onended = () => {
        if (currentAudio === audio) currentAudio = null;
        playNext();
      };
      audio.onerror = () => {
        if (currentAudio === audio) currentAudio = null;
        playNext();
      };
      audio.src = url;
      audio.play().catch(() => playNext());
    }
    playNext();
  }
}

// ---------- Worker TTS 高质量合成 (优先) ----------
async function playWithWorker(text, btn, isWord) {
  return new Promise((resolve) => {
    // 超时计时: 超出时间即放弃worker，降级
    const timeoutId = setTimeout(() => {
      if (!finished) resolve(false);
    }, WORKER_TIMEOUT_MS);

    let finished = false;
    // 创建 AbortController 用于取消请求
    const controller = new AbortController();
    currentFetchAbort = controller;

    const url = `${TTS_WORKER_URL}?text=${encodeURIComponent(text)}&lang=en`;
    fetch(url, { signal: controller.signal })
      .then(response => {
        if (!response.ok) throw new Error(`Worker TTS error: ${response.status}`);
        return response.blob();
      })
      .then(blob => {
        if (finished || controller.signal.aborted) return;
        clearTimeout(timeoutId);
        const audioUrl = URL.createObjectURL(blob);
        currentObjectUrl = audioUrl;
        const audio = new Audio(audioUrl);
        currentAudio = audio;
        isWorkerPlaying = true;

        audio.onended = () => {
          cleanupAudio();
          if (btn && currentBtn === btn) btn.classList.remove('playing');
          if (currentBtn === btn) currentBtn = null;
          finished = true;
          resolve(true);
        };
        audio.onerror = (err) => {
          cleanupAudio();
          finished = true;
          resolve(false);
        };
        audio.play().catch(err => {
          cleanupAudio();
          finished = true;
          resolve(false);
        });
        function cleanupAudio() {
          if (currentAudio === audio) currentAudio = null;
          if (currentObjectUrl === audioUrl) {
            URL.revokeObjectURL(audioUrl);
            currentObjectUrl = null;
          }
          isWorkerPlaying = false;
        }
      })
      .catch(err => {
        if (controller.signal.aborted) return;
        clearTimeout(timeoutId);
        finished = true;
        resolve(false);
      });
  });
}

// ---------- 核心入口: 优先Worker，失败则降级 ----------
async function speak(text, btn, isWord) {
  // 完全停止当前任何播放
  stopCurrent();
  
  if (btn) {
    btn.classList.add('playing');
    currentBtn = btn;
  }
  
  // 尝试 Worker 高音质发音
  const workerSuccess = await playWithWorker(text, btn, isWord);
  
  if (workerSuccess) {
    // Worker播放成功，已经处理按钮移除事件，无需额外操作
    return;
  }
  
  // Worker失败或超时 -> 降级到稳定有道发音
  if (currentBtn === btn) {
    // 确保没有残留播放状态
    if (btn) btn.classList.remove('playing');
    currentBtn = null;
  }
  // 调用降级方案
  legacySpeak(text, btn, isWord);
}

// --------------------- 日常渲染与逻辑 ---------------------
function mod(a, n) { return ((a % n) + n) % n; }

function getDayIndex() {
  const start = new Date('2026-05-29');
  const today = new Date(); today.setHours(0,0,0,0);
  const d = Math.floor((today - start) / 86400000);
  return d < 0 ? 0 : d;
}

function getTodayWords() {
  const day = getDayIndex();
  const n = WORDS.length;
  const si = mod(day * 5, n);
  const main = Array.from({length:5}, (_,i) => WORDS[mod(si+i, n)]);
  const review = [
    WORDS[mod(si + 7, n)],
    WORDS[mod(si + 13, n)],
  ];
  return { main, review };
}

function buildSentence(sentence, highlight) {
  const regex = new RegExp('(\\b' + highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b)', 'i');
  return sentence.replace(regex, '<span class="highlight">$1</span>');
}

let cardCounter = 0;
function createCard(item, index, total) {
  cardCounter++;
  const div = document.createElement('div');
  div.className = 'card';
  const wId = 'w' + cardCounter, sId = 's' + cardCounter;
  const esc = s => s.replace(/'/g, "\\'").replace(/[\n\r]/g, ' ');
  div.innerHTML = `
    <div class="card-top">
      <div class="word">${item.word}</div>
      <div class="card-num">${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
    </div>
    <div class="phonetic">${item.phonetic}</div>
    <div class="meaning-tag">${item.meaning}</div>
    <div class="divider"></div>
    <div class="sentence-en">${buildSentence(item.sentence, item.highlight)}</div>
    <div class="sentence-zh">${item.zh}</div>
    <div class="btn-group">
      <button class="btn btn-word" id="${wId}" data-word="${esc(item.word)}" data-isword="true">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>听单词
      </button>
      <button class="btn btn-sent" id="${sId}" data-sentence="${esc(item.sentence)}" data-isword="false">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>听例句
      </button>
    </div>`;
  
  const wordBtn = div.querySelector(`#${wId}`);
  const sentBtn = div.querySelector(`#${sId}`);
  wordBtn.onclick = (e) => {
    e.preventDefault();
    speak(item.word, wordBtn, true);
  };
  sentBtn.onclick = (e) => {
    e.preventDefault();
    speak(item.sentence, sentBtn, false);
  };
  return div;
}

function render() {
  const { main, review } = getTodayWords();
  const todayEl = document.getElementById('todayCards');
  const reviewEl = document.getElementById('reviewCards');
  todayEl.innerHTML = '';
  reviewEl.innerHTML = '';
  main.forEach((w,i) => todayEl.appendChild(createCard(w, i, main.length)));
  review.forEach((w,i) => reviewEl.appendChild(createCard(w, i, review.length)));

  const day = getDayIndex();
  const groupTotal = Math.ceil(WORDS.length / 5);
  const groupIndex = (day % groupTotal) + 1;
  document.getElementById('progressFill').style.width = (groupIndex / groupTotal * 100) + '%';
  document.getElementById('progressLabel').textContent = `第 ${groupIndex} 组 / 共 ${groupTotal} 组 · ${WORDS.length} 词总库`;

  const d = new Date();
  const months = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('dateStr').innerHTML = `${d.getFullYear()} 年 ${months[d.getMonth()]} 月 ${d.getDate()} 日 <span class="tts-badge">✨AI语音</span>`;
  updateStreak();
}

function updateStreak() {
  const key = 'eng_streak';
  const today = new Date().toDateString();
  let data = { streak:0, last:'', total:0 };
  try { data = JSON.parse(localStorage.getItem(key)) || data; } catch(e){}
  if (data.last !== today) {
    const yesterday = new Date(Date.now()-86400000).toDateString();
    data.streak = data.last === yesterday ? data.streak+1 : 1;
    data.last = today;
    data.total = (data.total||0) + 5;
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){}
  }
  document.getElementById('streakDays').textContent = data.streak;
  document.getElementById('totalWords').textContent = data.total;
}

render();
</script>
