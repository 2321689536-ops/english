<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>每日英语</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a2e;
      --paper: #faf8f3;
      --accent: #e8603c;
      --muted: #8a8a9a;
      --card-bg: #ffffff;
      --tag-bg: #f0ede6;
      --shadow: 0 4px 24px rgba(26,26,46,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      padding: 36px 22px 20px;
      max-width: 520px;
      margin: auto;
    }
    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 16px;
    }
    .date-badge .dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      display: inline-block;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
    }
    .progress-wrap {
      max-width: 520px;
      margin: 0 auto 28px;
      padding: 0 22px;
    }
    .progress-bar {
      height: 3px;
      background: #e2ded6;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .progress-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }
    .cards-container {
      max-width: 520px;
      margin: auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 28px 26px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp 0.45s ease forwards;
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.26s; }
    .card:nth-child(5) { animation-delay: 0.33s; }
    .card:nth-child(6) { animation-delay: 0.38s; }
    .card:nth-child(7) { animation-delay: 0.43s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .word {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .card-num {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: var(--tag-bg);
      padding: 4px 10px;
      border-radius: 100px;
      margin-top: 6px;
    }
    .meaning-tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 18px;
    }
    .phonetic {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      font-style: italic;
    }
    .divider {
      height: 1px;
      background: #f0ede6;
      margin-bottom: 18px;
    }
    .sentence-en {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 8px;
    }
    .highlight { color: var(--accent); font-style: italic; }
    .sentence-zh {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 14px;
      min-height: 46px;
      transition: all 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-word { background: var(--ink); color: #fff; flex: 1; }
    .btn-sent { background: var(--tag-bg); color: var(--ink); flex: 1.2; }
    .btn:active { transform: scale(0.96); }
    .btn.playing { background: var(--accent); color: #fff; }
    .btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .review-label {
      max-width: 520px;
      margin: 4px auto 12px;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .footer {
      max-width: calc(100% - 32px);
      margin: 24px 16px 0;
      padding: 24px 22px;
      background: var(--ink);
      color: rgba(255,255,255,0.85);
      border-radius: 28px;
      font-size: 14px;
      line-height: 1.9;
    }
    .footer strong { color: #fff; font-size: 15px; }
    .footer .tip {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.8;
    }
    .streak-row {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto 20px;
      padding: 0 22px;
    }
    .streak-box {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 14px 18px;
      flex: 1;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .streak-icon { font-size: 22px; }
    .streak-info .val { font-size: 20px; font-weight: 700; line-height: 1; }
    .streak-info .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 400px) {
      h1 { font-size: 34px; }
      .word { font-size: 36px; }
      .sentence-en { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="date-badge">
    <span class="dot"></span>
    <span id="dateStr">今日单词</span>
  </div>
  <h1>每日<span>英语</span><br>微习惯</h1>
  <p class="subtitle">每天 5 个词 · 听读结合 · 持续接触<br>重点不是努力，而是每天都见到它</p>
</div>

<div class="streak-row">
  <div class="streak-box">
    <div class="streak-icon">🔥</div>
    <div class="streak-info">
      <div class="val" id="streakDays">—</div>
      <div class="lbl">连续天数</div>
    </div>
  </div>
  <div class="streak-box">
    <div class="streak-icon">📚</div>
    <div class="streak-info">
      <div class="val" id="totalWords">—</div>
      <div class="lbl">累计单词</div>
    </div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">第 1 组 / 共 ? 组</div>
</div>

<div class="cards-container" id="todayCards"></div>
<div class="review-label">👀 复习回顾</div>
<div class="cards-container" id="reviewCards"></div>

<div class="footer">
  <strong>坚持下去的秘诀</strong><br>
  不是每次都记住，<br>
  而是每天都打开一次。<br>
  几个月后，你会发现英语开始变得熟悉。
  <div class="tip">
    建议使用 Chrome 或 Edge 浏览器以获得最佳发音效果。<br>
    手机、平板、电脑均可使用。
  </div>
</div>

// ─── SPEECH（多重方案，兼容华为浏览器）────────────────────────────
// 单词：有道 TTS（专为单词设计，发音准，国内快）→ Web Speech
// 例句：Google TTS（对句子最稳定）→ 有道 TTS → Web Speech
// 根本原因：有道 TTS 是「词典发音」接口，对完整句子支持不稳定

let currentBtn = null;
let currentAudio = null;

function stopCurrent() {
  if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn = null; }
  if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
  try { speechSynthesis.cancel(); } catch(e) {}
}

// isWord=true 走单词链，false 走句子链
function speak(text, btn, isWord) {
  stopCurrent();
  if (btn) { btn.classList.add('playing'); currentBtn = btn; }

  const onDone = () => {
    if (btn) btn.classList.remove('playing');
    if (currentBtn === btn) currentBtn = null;
  };

  function tryWebSpeech() {
    if (!window.speechSynthesis) { onDone(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = isWord ? 0.8 : 0.85; u.pitch = 1.05; u.volume = 1;
    u.onend = onDone; u.onerror = onDone;
    function go() {
      const vs = speechSynthesis.getVoices();
      const v = vs.find(v => v.lang === 'en-US' && v.name.includes('Google'))
             || vs.find(v => v.lang === 'en-US')
             || vs.find(v => v.lang.startsWith('en'));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
    speechSynthesis.getVoices().length === 0
      ? (speechSynthesis.onvoiceschanged = go) : go();
  }

  if (isWord) {
    // 单词：直接用有道词典接口，收录了标准美式发音
    const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
    playAudio(url, tryWebSpeech, onDone, 5000);
  } else {
    // 句子：全部用有道整句，长句拆两段（每段≤20字符），彻底解决逐词男女声问题
    function youdaoPlay(phrase, callback) {
      // 去掉末尾标点，有道对带标点的句子随机失败
      const clean = phrase.replace(/[.?!,;:]+$/g, '').trim();
      const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(clean) + '&type=2';
      playAudio(url, callback, callback, 5000);
    }

    if (text.length <= 20) {
      youdaoPlay(text, onDone);
    } else {
      // 找最佳断点，使两段都≤20字符
      const words = text.split(' ');
      let part1 = '', part2 = '';
      for (let cut = 1; cut < words.length; cut++) {
        const p1 = words.slice(0, cut).join(' ');
        const p2 = words.slice(cut).join(' ');
        if (p1.length <= 20 && p2.length <= 20) {
          part1 = p1; part2 = p2; break;
        }
      }
      if (part1) {
        // 两段依次播放，中间停顿200ms
        youdaoPlay(part1, () => setTimeout(() => youdaoPlay(part2, onDone), 200));
      } else {
        // 极端情况降级逐词
        const ws = text.match(/[a-zA-Z]+/g) || [];
        let i = 0;
        function playNext() {
          if (i >= ws.length) { onDone(); return; }
          const w = ws[i++];
          playAudio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(w) + '&type=2',
            () => setTimeout(playNext, 150), () => setTimeout(playNext, 150), 4000);
        }
        playNext();
      }
    }
  }
}

function playAudio(url, onFail, onDone, timeout) {
  const audio = new Audio();
  currentAudio = audio;
  let done = false;

  const finish = (ok) => {
    if (done) return; done = true;
    audio.pause(); audio.src = '';
    if (currentAudio === audio) currentAudio = null;
    ok ? onDone() : onFail();
  };

  audio.onended = () => finish(true);
  audio.onerror = () => finish(false);

  // 超时：到时间还没开始播就换下一个方案
  const timer = setTimeout(() => finish(false), timeout || 5000);
  // 一旦可以播放就取消超时倒计时
  audio.oncanplay = () => clearTimeout(timer);

  audio.src = url;
  audio.load();
  audio.play().catch(() => finish(false));
}

// ─── DATE & SELECTION ────────────────────────────────────────────
function getDayIndex() {
  const start = new Date('2026-05-29');
  const today = new Date(); today.setHours(0,0,0,0);
  const d = Math.floor((today - start) / 86400000);
  return d < 0 ? 0 : d;  // 时区差异导致负数时归零
}

// JS取模安全版（负数也返回正数）
function mod(a, n) { return ((a % n) + n) % n; }

function getTodayWords() {
  const day = getDayIndex();
  const n = WORDS.length;
  const si = mod(day * 5, n);
  const main = Array.from({length:5}, (_,i) => WORDS[mod(si+i, n)]);
  const review = [
    WORDS[mod(si + 7, n)],
    WORDS[mod(si + 13, n)],
  ];
  return { main, review };
}

// ─── HIGHLIGHT ───────────────────────────────────────────────────
function buildSentence(sentence, highlight) {
  return sentence.replace(new RegExp('(\\b' + highlight + '\\b)', 'i'),
    '<span class="highlight">$1</span>');
}

// ─── CREATE CARD ─────────────────────────────────────────────────
let cc = 0;
function createCard(item, index, total) {
  cc++;
  const div = document.createElement('div');
  div.className = 'card';
  const wId = 'w'+cc, sId = 's'+cc;
  const esc = s => s.replace(/'/g, "\\'");
  div.innerHTML = `
    <div class="card-top">
      <div class="word">${item.word}</div>
      <div class="card-num">${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
    </div>
    <div class="phonetic">${item.phonetic}</div>
    <div class="meaning-tag">${item.meaning}</div>
    <div class="divider"></div>
    <div class="sentence-en">${buildSentence(item.sentence, item.highlight)}</div>
    <div class="sentence-zh">${item.zh}</div>
    <div class="btn-group">
      <button class="btn btn-word" id="${wId}" onclick="speak('${esc(item.word)}',document.getElementById('${wId}'),true)">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>听单词
      </button>
      <button class="btn btn-sent" id="${sId}" onclick="speak('${esc(item.sentence)}',document.getElementById('${sId}'),false)">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>听例句
      </button>
    </div>`;
  return div;
}

// ─── RENDER ──────────────────────────────────────────────────────
function render() {
  const { main, review } = getTodayWords();
  const todayEl = document.getElementById('todayCards');
  const reviewEl = document.getElementById('reviewCards');
  main.forEach((w,i) => todayEl.appendChild(createCard(w, i, main.length)));
  review.forEach((w,i) => reviewEl.appendChild(createCard(w, i, review.length)));

  const day = getDayIndex();
  const groupTotal = Math.ceil(WORDS.length / 5);
  const groupIndex = (day % groupTotal) + 1;
  document.getElementById('progressFill').style.width = (groupIndex / groupTotal * 100) + '%';
  document.getElementById('progressLabel').textContent = `第 ${groupIndex} 组 / 共 ${groupTotal} 组 · ${WORDS.length} 词总库`;

  const d = new Date();
  const months = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('dateStr').textContent =
    `${d.getFullYear()} 年 ${months[d.getMonth()]} 月 ${d.getDate()} 日`;

  updateStreak();
}

function updateStreak() {
  const key = 'eng_streak';
  const today = new Date().toDateString();
  let data = { streak:0, last:'', total:0 };
  try { data = JSON.parse(localStorage.getItem(key)) || data; } catch(e){}
  if (data.last !== today) {
    const yesterday = new Date(Date.now()-86400000).toDateString();
    data.streak = data.last === yesterday ? data.streak+1 : 1;
    data.last = today;
    data.total = (data.total||0) + 5;
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){}
  }
  document.getElementById('streakDays').textContent = data.streak;
  document.getElementById('totalWords').textContent = data.total;
}

render();
