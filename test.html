<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TTS诊断 v3</title>
<style>
  body{font-family:sans-serif;padding:16px;background:#f5f5f5;}
  .group{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h3{font-size:13px;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
  .btn{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border:none;border-radius:12px;background:#1a1a2e;color:#fff;font-size:14px;text-align:left;cursor:pointer;}
  .btn.ok{background:#16a34a;} .btn.fail{background:#dc2626;} .btn.run{background:#d97706;}
  .log{background:#111;color:#0f0;font-size:11px;font-family:monospace;padding:12px;border-radius:10px;min-height:100px;white-space:pre-wrap;word-break:break-all;max-height:250px;overflow-y:auto;}
</style>
</head>
<body>
<h2 style="margin-bottom:4px">TTS诊断 v3</h2>
<p style="color:#888;font-size:13px;margin-bottom:16px">请把这个文件也上传到GitHub，从 github.io 网址打开测试</p>

<div class="group">
  <h3>百度TTS — 不同句子</h3>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+want+to+go+home&spd=3&source=web')">① 百度: I want to go home</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=We+have+time&spd=3&source=web')">② 百度: We have time</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+feel+tired+I+need+sleep&spd=3&source=web')">③ 百度: I feel tired I need sleep</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=Take+your+time&spd=3&source=web')">④ 百度: Take your time</button>
</div>

<div class="group">
  <h3>有道TTS — 句子测试</h3>
  <button class="btn" onclick="t(this,'https://dict.youdao.com/dictvoice?audio=I+want+to+go+home&type=2')">⑤ 有道: I want to go home</button>
  <button class="btn" onclick="t(this,'https://dict.youdao.com/dictvoice?audio=We+have+time&type=2')">⑥ 有道: We have time</button>
</div>

<div class="group">
  <h3>逐词对比 — 有无延迟</h3>
  <button class="btn" onclick="wordByWord(this,0)">⑦ 逐词无延迟: I want to go home</button>
  <button class="btn" onclick="wordByWord(this,150)">⑧ 逐词150ms延迟: I want to go home</button>
  <button class="btn" onclick="wordByWord(this,100)">⑨ 逐词100ms延迟: I want to go home</button>
</div>

<div class="group">
  <h3>诊断日志</h3>
  <div class="log" id="log">等待...</div>
</div>

<script>
const log=document.getElementById('log');
function L(m){log.textContent+=new Date().toLocaleTimeString()+' '+m+'\n';log.scrollTop=9999;}
let cur=null;
function stop(){if(cur){try{cur.pause();cur.src='';}catch(e){}cur=null;}}

function t(btn,url){
  stop();
  const orig=btn.textContent;
  btn.className='btn run'; btn.textContent='⏳ 加载中...';
  L('请求: '+url.substring(0,60)+'...');
  const a=new Audio(); cur=a; let done=false;
  const finish=(ok,msg)=>{
    if(done)return; done=true;
    btn.className='btn '+(ok?'ok':'fail');
    btn.textContent=(ok?'✅ ':'❌ ')+orig;
    L((ok?'✅ 成功':'❌ 失败')+(msg?' '+msg:''));
  };
  a.onplaying=()=>{btn.textContent='🔊 '+orig;L('  playing');};
  a.onended=()=>finish(true);
  a.onerror=()=>finish(false,'error code='+(a.error?a.error.code:'?'));
  const timer=setTimeout(()=>finish(false,'超时5s'),5000);
  a.oncanplay=()=>clearTimeout(timer);
  a.src=url;
  a.play().catch(e=>finish(false,'play rejected: '+e.message));
}

function wordByWord(btn,delay){
  stop();
  const orig=btn.textContent;
  btn.className='btn run';
  const words=['I','want','to','go','home'];
  let i=0, ok=0;
  L('逐词播放 delay='+delay+'ms');
  function next(){
    if(i>=words.length){
      btn.className='btn ok'; btn.textContent='✅ '+orig;
      L('完成 '+ok+'/'+words.length+'词成功'); return;
    }
    const w=words[i++];
    const url='https://dict.youdao.com/dictvoice?audio='+w+'&type=2';
    const a=new Audio(); cur=a; let done=false;
    const finish=(success)=>{
      if(done)return; done=true;
      if(success)ok++;
      L('  '+(success?'✅':'❌')+' '+w);
      setTimeout(next, delay);
    };
    a.onended=()=>finish(true);
    a.onerror=()=>finish(false);
    setTimeout(()=>finish(false), 4000);
    a.oncanplay=()=>{};
    a.src=url;
    a.play().catch(()=>finish(false));
  }
  next();
}

window.onload=()=>L('域名: '+location.hostname);
</script>
</body>
</html>
