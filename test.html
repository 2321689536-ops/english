<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TTS诊断 v8</title>
<style>
  body{font-family:sans-serif;padding:16px;background:#f5f5f5;}
  .group{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h3{font-size:13px;color:#888;margin-bottom:12px;}
  .btn{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border:none;border-radius:12px;background:#1a1a2e;color:#fff;font-size:14px;text-align:left;cursor:pointer;}
  .btn.ok{background:#16a34a;} .btn.fail{background:#dc2626;} .btn.run{background:#d97706;}
  .log{background:#111;color:#0f0;font-size:11px;font-family:monospace;padding:12px;border-radius:10px;min-height:150px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;}
</style>
</head>
<body>
<h2 style="margin-bottom:4px">TTS诊断 v8</h2>
<p style="color:#888;font-size:13px;margin-bottom:16px">分别用<b>微信、QQ、华为</b>打开，依次点击</p>

<div class="group">
  <h3>第一步：列出所有可用语音</h3>
  <button class="btn" onclick="listVoices(this)">① 列出设备语音列表</button>
</div>

<div class="group">
  <h3>第二步：Web Speech 播放测试</h3>
  <button class="btn" onclick="testSpeech(this,'en-US','I know your name')">② en-US 整句</button>
  <button class="btn" onclick="testSpeech(this,'en-GB','I know your name')">③ en-GB 整句</button>
  <button class="btn" onclick="testSpeech(this,'en','I know your name')">④ en 整句</button>
  <button class="btn" onclick="testSpeech(this,'zh-CN','hello world')">⑤ zh-CN 测试（验证Speech能工作）</button>
</div>

<div class="group">
  <h3>第三步：有道单词（已知可用）</h3>
  <button class="btn" onclick="testAudio(this,'https://dict.youdao.com/dictvoice?audio=know&type=2')">⑥ 有道单词 know</button>
  <button class="btn" onclick="testAudio(this,'https://dict.youdao.com/dictvoice?audio=name&type=2')">⑦ 有道单词 name</button>
</div>

<div class="group">
  <h3>诊断日志（请截图）</h3>
  <div class="log" id="log">等待...</div>
  <button class="btn" style="background:#374151;margin-top:8px;font-size:13px" onclick="document.getElementById('log').textContent=''">清空</button>
</div>

<script>
const log=document.getElementById('log');
function L(m){log.textContent+=new Date().toLocaleTimeString()+' '+m+'\n';log.scrollTop=9999;}

function listVoices(btn){
  btn.className='btn run';
  function show(){
    const vs=speechSynthesis.getVoices();
    L('语音总数: '+vs.length);
    vs.forEach(v=>L('  '+v.lang+' | '+v.name+(v.localService?' [本地]':' [网络]')));
    const en=vs.filter(v=>v.lang.startsWith('en'));
    L('英文语音: '+en.length+'个');
    btn.className= en.length>0?'btn ok':'btn fail';
    btn.textContent= en.length>0?'✅ 找到'+en.length+'个英文语音':'❌ 无英文语音';
  }
  if(speechSynthesis.getVoices().length>0) show();
  else{ speechSynthesis.onvoiceschanged=show; setTimeout(()=>show(),2000); }
  L('→ 获取语音列表...');
}

function testSpeech(btn,lang,text){
  const orig=btn.textContent;
  btn.className='btn run';
  if(!window.speechSynthesis){
    btn.className='btn fail'; btn.textContent='❌ 不支持'; L('❌ 无speechSynthesis'); return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=0.9; u.volume=1;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang===lang)||vs.find(v=>v.lang.startsWith(lang.split('-')[0]));
  if(v){u.voice=v; L('使用语音: '+v.name);}
  else L('未找到'+lang+'语音，用默认');
  u.onstart=()=>{btn.textContent='🔊 '+orig; L('  started');};
  u.onend=()=>{btn.className='btn ok';btn.textContent='✅ '+orig;L('✅ 播放完成');};
  u.onerror=(e)=>{btn.className='btn fail';btn.textContent='❌ '+orig;L('❌ 错误:'+e.error);};
  speechSynthesis.speak(u);
  L('→ speak('+lang+') "'+text+'"');
}

function testAudio(btn,url){
  const orig=btn.textContent;
  btn.className='btn run';
  L('→ Audio: '+url.substring(url.indexOf('audio=')+6,url.indexOf('&')));
  const a=new Audio(); let done=false;
  const fin=(ok)=>{if(done)return;done=true;
    btn.className='btn '+(ok?'ok':'fail');
    btn.textContent=(ok?'✅ ':'❌ ')+orig;
    L(ok?'✅ 成功':'❌ 失败');
  };
  a.onplaying=()=>{btn.textContent='🔊 '+orig;L('  playing');};
  a.onended=()=>fin(true); a.onerror=()=>fin(false);
  setTimeout(()=>fin(false),5000);
  a.oncanplay=()=>{};
  a.src=url; a.play().catch(e=>fin(false));
}

window.onload=()=>{
  L('UA: '+navigator.userAgent.substring(0,80));
  L('speechSynthesis: '+(!!window.speechSynthesis));
};
</script>
</body>
</html>
