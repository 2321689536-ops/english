<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TTS诊断 v7</title>
<style>
  body{font-family:sans-serif;padding:16px;background:#f5f5f5;}
  .group{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h3{font-size:13px;color:#888;margin-bottom:12px;}
  .btn{display:block;width:100%;padding:14px 16px;margin-bottom:10px;border:none;border-radius:12px;background:#1a1a2e;color:#fff;font-size:14px;text-align:left;cursor:pointer;}
  .btn.ok{background:#16a34a;} .btn.fail{background:#dc2626;} .btn.run{background:#d97706;}
  .log{background:#111;color:#0f0;font-size:11px;font-family:monospace;padding:12px;border-radius:10px;min-height:120px;white-space:pre-wrap;word-break:break-all;max-height:350px;overflow-y:auto;}
</style>
</head>
<body>
<h2 style="margin-bottom:4px">TTS诊断 v7</h2>
<p style="color:#888;font-size:13px;margin-bottom:16px">分别用<b>微信、QQ、华为</b>浏览器打开测试</p>

<div class="group">
  <h3>百度TTS — 不同写法</h3>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+know+your+name&spd=3&source=web')">① 百度 source=web</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+know+your+name&spd=3&source=home')">② 百度 source=home</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+know+your+name&spd=3')">③ 百度 无source</button>
  <button class="btn" onclick="t(this,'https://fanyi.baidu.com/gettts?lan=en&text=I+know+your+name&spd=2&source=web')">④ 百度 spd=2</button>
</div>

<div class="group">
  <h3>其他整句TTS</h3>
  <button class="btn" onclick="t(this,'https://dict.youdao.com/dictvoice?audio=I+know+your+name&type=2')">⑤ 有道整句</button>
  <button class="btn" onclick="t(this,'https://tts.youdao.com/base_v1/json_api?q=I+know+your+name&langFrom=en&langTo=zh-CHS&type=1&appKey=webfanyi')">⑥ 有道fanyi API</button>
  <button class="btn" onclick="testSpeech(this)">⑦ Web Speech API</button>
  <button class="btn" onclick="t(this,'https://translate.google.com/translate_tts?ie=UTF-8&tl=en-US&client=gtx&q=I+know+your+name')">⑧ Google TTS gtx</button>
</div>

<div class="group">
  <h3>诊断日志</h3>
  <div class="log" id="log">等待...</div>
  <button class="btn" style="background:#374151;margin-top:8px;font-size:13px" onclick="document.getElementById('log').textContent=''">清空</button>
</div>

<script>
const log=document.getElementById('log');
function L(m){log.textContent+=new Date().toLocaleTimeString()+' '+m+'\n';log.scrollTop=9999;}

let cur=null;
function stop(){if(cur){try{cur.pause();cur.src='';}catch(e){}cur=null;}}

function t(btn,url){
  stop();
  const orig=btn.textContent;
  btn.className='btn run'; btn.textContent='⏳ 加载...';
  L('→ '+url.substring(0,70));
  const a=new Audio(); cur=a; let done=false;
  const fin=(ok,msg)=>{
    if(done)return;done=true;
    btn.className='btn '+(ok?'ok':'fail');
    btn.textContent=(ok?'✅ ':'❌ ')+orig;
    L((ok?'✅ 成功':'❌ 失败')+(msg?' ['+msg+']':''));
  };
  a.oncanplay =()=>{ L('  canplay ✓'); clearTimeout(tm); };
  a.onplaying =()=>{ btn.textContent='🔊 '+orig; L('  playing ✓'); };
  a.onended   =()=>fin(true);
  a.onerror   =()=>fin(false,'error='+(a.error?a.error.code:'?'));
  a.onstalled =()=>L('  stalled');
  const tm=setTimeout(()=>fin(false,'超时6s'),6000);
  a.src=url;
  a.play().catch(e=>fin(false,'rejected:'+e.message));
}

function testSpeech(btn){
  const orig=btn.textContent;
  btn.className='btn run';
  if(!window.speechSynthesis){
    btn.className='btn fail'; btn.textContent='❌ 不支持';
    L('❌ speechSynthesis不存在'); return;
  }
  const u=new SpeechSynthesisUtterance('I know your name');
  u.lang='en-US'; u.rate=0.9;
  u.onstart=()=>{btn.textContent='🔊 '+orig; L('  speech started');};
  u.onend=()=>{btn.className='btn ok';btn.textContent='✅ '+orig;L('✅ speech ended');};
  u.onerror=(e)=>{btn.className='btn fail';btn.textContent='❌ '+orig;L('❌ speech error:'+e.error);};
  speechSynthesis.speak(u);
  L('→ speechSynthesis.speak() called');
}

window.onload=()=>{
  L('浏览器: '+navigator.userAgent.substring(0,100));
  L('域名: '+location.hostname);
};
</script>
</body>
</html>
